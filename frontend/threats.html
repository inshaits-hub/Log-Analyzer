<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log Analyzer - Threats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="js/tailwind-config.js"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-surface-container-low text-on-surface font-body-md text-body-md antialiased min-h-screen flex flex-col m-0 p-0 selection:bg-primary-container selection:text-on-primary" data-page="threats">
<div id="app-shell"></div>
<script src="js/ui/layout.js"></script>
<main class="w-full max-w-[1440px] mx-auto px-6 py-6 flex-1 flex flex-col">
<div class="flex justify-between items-center shrink-0">
<div class="flex items-baseline">
<h1 class="text-[20px] leading-[26px] font-semibold text-on-surface font-headline-md tracking-tight">
          Threats
        </h1>
<span class="ml-2.5 font-body-md text-body-md text-secondary" id="threats-count">-</span>
</div>
<div>
<button class="bg-surface-container-lowest border border-outline text-on-surface font-body-md text-body-md font-medium px-4 py-1.5 hover:bg-surface-container-low transition-colors rounded-none focus:outline-none focus:ring-2 focus:ring-primary-container focus:ring-offset-1 flex items-center gap-1.5" id="threats-export-button" type="button">
<span class="material-symbols-outlined text-[16px] text-secondary leading-none" data-icon="file_download">file_download</span>
          Export report
        </button>
</div>
</div>
<div class="my-4 flex flex-wrap items-center gap-3 shrink-0">
<div class="relative w-64">
<span class="absolute inset-y-0 left-0 pl-2.5 flex items-center pointer-events-none text-secondary">
<span class="material-symbols-outlined text-[16px]" data-icon="search">search</span>
</span>
<input class="w-full bg-surface-container-lowest border border-outline text-on-surface font-body-md text-body-md pl-8 pr-3 py-1.5 rounded-none focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container placeholder:text-secondary placeholder:font-body-md" id="threats-search" placeholder="Search IP, type or details" type="text"/>
</div>
<div class="relative">
<select class="appearance-none bg-surface-container-lowest border border-outline text-on-surface font-body-md text-body-md pl-3 pr-8 py-1.5 rounded-none focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container cursor-pointer" id="threats-filter-severity">
<option value="">Severity: All</option>
<option value="CRITICAL">Critical</option>
<option value="HIGH">High</option>
<option value="MEDIUM">Medium</option>
<option value="LOW">Low</option>
</select>
<span class="material-symbols-outlined absolute right-2 top-1/2 -translate-y-1/2 text-secondary pointer-events-none text-[16px]" data-icon="arrow_drop_down">arrow_drop_down</span>
</div>
<div class="relative">
<select class="appearance-none bg-surface-container-lowest border border-outline text-on-surface font-body-md text-body-md pl-3 pr-8 py-1.5 rounded-none focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container cursor-pointer" id="threats-filter-type">
<option value="">Type: All</option>
<option value="SSH_BRUTE_FORCE">SSH Brute-Force Attack</option>
<option value="SSH_BRUTE_FORCE_SUCCESS">Successful Brute-Force Login</option>
<option value="SQL_INJECTION">SQL Injection Attempt</option>
<option value="XSS_ATTEMPT">Cross-Site Scripting Attempt</option>
<option value="DIRECTORY_TRAVERSAL">Directory Traversal Attempt</option>
<option value="TRAFFIC_SPIKE">Traffic Spike / Volumetric Pattern</option>
<option value="OFF_HOUR_ADMIN">Off-Hour Administrative Activity</option>
<option value="WEB_DIRECTORY_SCAN">Web Content Scan</option>
<option value="PORT_SCAN">Port Scan</option>
</select>
<span class="material-symbols-outlined absolute right-2 top-1/2 -translate-y-1/2 text-secondary pointer-events-none text-[16px]" data-icon="arrow_drop_down">arrow_drop_down</span>
</div>
<div class="relative">
<select class="appearance-none bg-surface-container-lowest border border-outline text-on-surface font-body-md text-body-md pl-3 pr-8 py-1.5 rounded-none focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container cursor-pointer" id="threats-filter-time">
<option value="24">Last 24 hours</option>
<option value="12">Last 12 hours</option>
<option value="6">Last 6 hours</option>
<option value="1">Last 1 hour</option>
<option value="168">Last 7 days</option>
</select>
<span class="material-symbols-outlined absolute right-2 top-1/2 -translate-y-1/2 text-secondary pointer-events-none text-[16px]" data-icon="arrow_drop_down">arrow_drop_down</span>
</div>
<button class="text-primary-container text-[13px] font-body-sm hover:underline cursor-pointer ml-1 select-none font-medium" id="threats-clear-filters" type="button">
        Clear filters
      </button>
</div>
<div class="bg-surface-container-lowest border border-surface-container-highest rounded-none flex-1 flex flex-col overflow-hidden">
<div class="overflow-x-auto custom-scroll flex-1">
<table class="w-full border-collapse text-left text-on-surface">
<thead>
<tr class="bg-surface-container-low border-b border-outline h-8 select-none">
<th class="py-1 px-4 font-label-sm text-label-sm font-semibold tracking-wider text-on-surface uppercase w-32" scope="col">
                Severity
              </th>
<th class="py-1 px-4 font-label-sm text-label-sm font-semibold tracking-wider text-on-surface uppercase" scope="col">
                Type
              </th>
<th class="py-1 px-4 font-label-sm text-label-sm font-semibold tracking-wider text-on-surface uppercase w-36" scope="col">
                Source IP
              </th>
<th class="py-1 px-4 font-label-sm text-label-sm font-semibold tracking-wider text-on-surface uppercase min-w-[240px]" scope="col">
                Details
              </th>
<th class="py-1 px-4 font-label-sm text-label-sm font-semibold tracking-wider text-on-surface uppercase text-right w-28" scope="col">
                Risk score
              </th>
<th class="py-1 px-4 font-label-sm text-label-sm font-semibold tracking-wider text-on-surface uppercase w-48 cursor-pointer hover:bg-surface-container-high transition-colors" id="threats-sort-last-seen" scope="col">
<div class="flex items-center space-x-1">
<span>Timestamp</span>
<span class="material-symbols-outlined text-[14px] leading-none" data-icon="arrow_downward" id="threats-sort-icon">arrow_downward</span>
</div>
</th>
</tr>
</thead>
<tbody class="divide-y divide-surface-container-highest font-body-sm text-body-sm" id="threats-tbody"></tbody>
</table>
</div>
<footer class="p-3 bg-surface-container-lowest border-t border-surface-container-highest flex justify-between items-center text-[13px] text-secondary shrink-0 select-none">
<div class="font-body-sm">
<span id="threats-range">-</span>
</div>
<div class="flex items-center space-x-6 font-body-sm">
<div class="flex items-center space-x-2">
<span>Items per page:</span>
<div class="relative inline-block">
<select class="appearance-none bg-transparent pr-5 pl-1 py-0.5 border-b border-outline text-on-surface font-body-sm text-[13px] focus:outline-none focus:border-primary-container cursor-pointer" id="threats-page-size">
<option>25</option>
<option>50</option>
<option>100</option>
</select>
<span class="material-symbols-outlined absolute right-0 top-1/2 -translate-y-1/2 text-secondary pointer-events-none text-[14px]" data-icon="arrow_drop_down">arrow_drop_down</span>
</div>
</div>
<div class="flex items-center space-x-1">
<button aria-label="Previous Page" class="w-7 h-7 flex items-center justify-center text-outline-variant cursor-not-allowed" id="threats-prev-button" type="button">
<span class="material-symbols-outlined text-[18px] leading-none" data-icon="chevron_left">chevron_left</span>
</button>
<button aria-label="Next Page" class="w-7 h-7 flex items-center justify-center text-on-surface hover:bg-surface-container-low transition-colors rounded-none focus:outline-none focus:ring-1 focus:ring-primary-container" id="threats-next-button" type="button">
<span class="material-symbols-outlined text-[18px] leading-none" data-icon="chevron_right">chevron_right</span>
</button>
</div>
</div>
</footer>
</div>
</main>
<div class="fixed inset-0 bg-[#161616]/40 z-40 flex items-center justify-center hidden" aria-labelledby="export-dialog-title" aria-modal="true" id="export-dialog-overlay" role="dialog">
<div class="w-full max-w-[460px] bg-surface-container-lowest border border-outline shadow-none p-6 z-50 rounded-none relative">
<div class="flex items-center justify-between pb-3 border-b border-surface-container-highest">
<h2 class="text-headline-sm font-headline-sm text-on-surface" id="export-dialog-title">Export report</h2>
<button aria-label="Close dialog" class="text-secondary hover:text-on-surface flex items-center justify-center w-6 h-6 focus:outline-none focus:ring-2 focus:ring-primary-container" id="export-dialog-close-button" type="button">
<span class="material-symbols-outlined text-lg" data-icon="close">close</span>
</button>
</div>
<div class="pt-4 space-y-5">
<div>
<label class="block text-label-md font-label-md text-on-surface mb-2">Export format</label>
<div class="space-y-2.5">
<label class="flex items-center gap-2.5 cursor-pointer">
<input checked="" class="w-4 h-4 text-primary-container border-on-surface focus:ring-0 focus:ring-offset-0" id="export-format-html" name="format" type="radio" value="html"/>
<span class="text-body-md font-body-md text-on-surface">
                HTML <span class="text-secondary text-body-sm font-body-sm">(readable summary)</span>
</span>
</label>
<label class="flex items-center gap-2.5 cursor-pointer">
<input class="w-4 h-4 text-primary-container border-on-surface focus:ring-0 focus:ring-offset-0" id="export-format-json" name="format" type="radio" value="json"/>
<span class="text-body-md font-body-md text-on-surface">
                JSON <span class="text-secondary text-body-sm font-body-sm">(raw data)</span>
</span>
</label>
</div>
</div>
<div class="pt-2 border-t border-surface-container-highest">
<p class="text-body-sm font-body-sm text-secondary mt-1 pl-6" id="export-dialog-helper-text"></p>
</div>
</div>
<p class="text-error font-body-sm text-body-sm mt-3 hidden" id="export-dialog-error"></p>
<div class="border-t border-surface-container-highest pt-4 mt-6 flex justify-end gap-3">
<button class="bg-surface-container-lowest border border-outline hover:border-on-surface hover:bg-surface-container-low text-on-surface px-4 py-1.5 text-body-md font-body-md h-8 flex items-center justify-center focus:outline-none focus:ring-2 focus:ring-primary-container" id="export-dialog-cancel-button" type="button">
          Cancel
        </button>
<button class="bg-primary-container text-on-primary hover:bg-[#002d9c] border border-primary-container px-4 py-1.5 text-body-md font-body-md h-8 flex items-center justify-center focus:outline-none focus:ring-2 focus:ring-primary-container" id="export-dialog-export-button" type="button">
          Export
        </button>
</div>
</div>
</div>
<script src="js/config.js"></script>
<script src="js/core/dom.js"></script>
<script src="js/core/format.js"></script>
<script src="js/core/pagination.js"></script>
<script src="js/ui/severity.js"></script>
<script src="js/services/http-client.js"></script>
<script src="js/services/mock-data.js"></script>
<script src="js/services/report-builder.js"></script>
<script src="js/services/download.js"></script>
<script src="js/services/mock-api.js"></script>
<script src="js/services/api.js"></script>
<script src="js/pages/threats.js"></script>
</body>
</html>
